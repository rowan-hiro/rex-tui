[package]
name = "rex-tui"
version = "0.2.0"
edition = "2021"
description = "TUI client for managing and attaching to local and remote Rex sessions (Unix, HTTP, SSH)"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
crossterm = { version = "0.28", features = ["event-stream"] }
futures-util = "0.3"
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
unicode-width = "0.2"
vt100 = "0.15"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
